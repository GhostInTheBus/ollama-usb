<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ollama Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #1a1a1a;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 20px;
    background: #111;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 600; color: #fff; }
  #model-select {
    margin-left: auto;
    background: #2a2a2a;
    color: #e0e0e0;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  #status {
    font-size: 12px;
    color: #888;
    padding: 6px 20px;
    background: #111;
    border-bottom: 1px solid #222;
    flex-shrink: 0;
  }
  #status.error { color: #e05555; }
  #status.ready { color: #55b055; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg { max-width: 800px; width: 100%; }
  .msg.user { align-self: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .msg-label {
    font-size: 11px;
    color: #666;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .msg.user .msg-label { text-align: right; }
  .msg-bubble {
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .msg-bubble {
    background: #1e4d8c;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant .msg-bubble {
    background: #2a2a2a;
    color: #e0e0e0;
    border-bottom-left-radius: 4px;
  }
  .cursor {
    display: inline-block; width: 8px; height: 14px;
    background: #888; animation: blink 1s step-end infinite;
    vertical-align: text-bottom; margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #input-area {
    padding: 16px 20px;
    background: #111;
    border-top: 1px solid #333;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  #input {
    flex: 1;
    background: #2a2a2a;
    color: #e0e0e0;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    resize: none;
    max-height: 160px;
    line-height: 1.5;
    font-family: inherit;
    outline: none;
  }
  #input:focus { border-color: #555; }
  #send {
    background: #1e4d8c;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  #send:hover { background: #2563ad; }
  #send:disabled { background: #333; color: #666; cursor: default; }
  #clear-btn {
    background: none;
    border: 1px solid #444;
    color: #888;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #clear-btn:hover { color: #ccc; border-color: #666; }
</style>
</head>
<body>

<header>
  <h1>Ollama Chat</h1>
  <select id="model-select"><option>Loading models...</option></select>
</header>
<div id="status">Connecting to Ollama...</div>
<div id="messages"></div>
<div id="input-area">
  <textarea id="input" rows="1" placeholder="Message..." disabled></textarea>
  <button id="clear-btn">Clear</button>
  <button id="send" disabled>Send</button>
</div>

<script>
const API = 'http://localhost:11435';
let currentModel = null;
let isStreaming = false;
let abortController = null;
let history = [];

const statusEl = document.getElementById('status');
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const modelSelect = document.getElementById('model-select');
const clearBtn = document.getElementById('clear-btn');

async function loadModels() {
  try {
    const res = await fetch(`${API}/api/tags`);
    if (!res.ok) throw new Error();
    const { models } = await res.json();
    if (!models?.length) throw new Error();
    modelSelect.innerHTML = models.map(m =>
      `<option value="${m.name}">${m.name}</option>`
    ).join('');
    currentModel = models[0].name;
    setStatus('ready', `Ready · ${models.length} model${models.length > 1 ? 's' : ''} available`);
    inputEl.disabled = false;
    sendBtn.disabled = false;
    inputEl.focus();
  } catch {
    setStatus('error', 'Cannot reach Ollama — is launch.command still open?');
    setTimeout(loadModels, 3000);
  }
}

modelSelect.addEventListener('change', () => { currentModel = modelSelect.value; });

function setStatus(type, msg) {
  statusEl.className = type;
  statusEl.textContent = msg;
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="msg-label">${role === 'user' ? 'You' : currentModel}</div><div class="msg-bubble"></div>`;
  messagesEl.appendChild(div);
  if (text) div.querySelector('.msg-bubble').textContent = text;
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div.querySelector('.msg-bubble');
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || isStreaming) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';
  isStreaming = true;
  sendBtn.disabled = true;
  sendBtn.textContent = 'Stop';
  sendBtn.onclick = () => abortController?.abort();

  addMessage('user', text);
  history.push({ role: 'user', content: text });

  const bubble = addMessage('assistant', '');
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  bubble.appendChild(cursor);

  let fullResponse = '';
  abortController = new AbortController();

  try {
    const res = await fetch(`${API}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: abortController.signal,
      body: JSON.stringify({ model: currentModel, messages: history, stream: true })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      for (const line of decoder.decode(value).split('\n').filter(Boolean)) {
        try {
          const chunk = JSON.parse(line);
          if (chunk.message?.content) {
            fullResponse += chunk.message.content;
            bubble.textContent = fullResponse;
            bubble.appendChild(cursor);
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
        } catch {}
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') bubble.textContent = '[Error — check that launch.command is still running]';
  }

  cursor.remove();
  bubble.textContent = fullResponse || bubble.textContent;
  if (fullResponse) history.push({ role: 'assistant', content: fullResponse });

  isStreaming = false;
  sendBtn.disabled = false;
  sendBtn.textContent = 'Send';
  sendBtn.onclick = send;
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

sendBtn.onclick = send;
clearBtn.onclick = () => { history = []; messagesEl.innerHTML = ''; };

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
});

loadModels();
</script>
</body>
</html>
